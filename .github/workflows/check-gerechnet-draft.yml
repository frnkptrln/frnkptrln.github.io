name: Check Gerechnet before publication
on:
  pull_request:
    paths: ['.github/workflows/check-gerechnet-draft.yml']
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install browser test client
        run: python3 -m pip install --user --break-system-packages playwright
      - name: Check pages in Chrome at 1366, 390 and 320 pixels
        run: |
          set -eu
          export CHECK_CHROME="$(command -v google-chrome)"
          python3 - <<'PY' &
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          class Handler(SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/favicon.ico':
                      self.send_response(204)
                      self.end_headers()
                      return
                  super().do_GET()
          ThreadingHTTPServer(('127.0.0.1', 8741), Handler).serve_forever()
          PY
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..30}; do curl -fsS -o /dev/null http://127.0.0.1:8741/ && break; sleep 0.2; done
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlsplit
          import os
          with sync_playwright() as pw:
              browser = pw.chromium.launch(executable_path=os.environ['CHECK_CHROME'], args=['--no-sandbox'])
              for width in (1366, 390, 320):
                  page = browser.new_page(viewport={'width':width, 'height':850}, reduced_motion='reduce')
                  issues, requests = [], []
                  page.on('pageerror', lambda e: issues.append(str(e)))
                  page.on('console', lambda m: issues.append(m.text) if m.type == 'error' else None)
                  page.on('request', lambda r: requests.append(r.url))
                  response = page.goto('http://127.0.0.1:8741/pieces/', wait_until='networkidle')
                  assert response.ok and page.evaluate('document.documentElement.scrollWidth <= innerWidth')
                  link = page.get_by_role('link', name='Enter Gerechnet. A flock wheels above a lake at dusk in Sieben Nachbarn.')
                  image = link.locator('img')
                  link.scroll_into_view_if_needed()
                  image.evaluate('(el) => el.decode()')
                  assert image.evaluate('(el) => el.naturalWidth === 960 && el.naturalHeight === 540')
                  rect = image.bounding_box()
                  assert rect['width'] > min(width * .6, 500) and abs(rect['width'] * 9/16 - rect['height']) < 1, rect
                  assert rect['x'] >= 0 and rect['x']+rect['width'] <= width
                  if width == 390:
                      link.focus()
                      page.keyboard.press('Enter')
                  else:
                      link.click()
                  page.wait_for_url('**/pieces/gerechnet/')
                  assert page.locator('h1').inner_text().split() == ['Films','without','a','camera.']
                  assert not issues, issues
                  assert all(urlsplit(url).hostname == '127.0.0.1' for url in requests), requests
                  print(width, 'cover displayed at',rect['width'],'x',rect['height'],'and opened the series')
                  page.close()
              browser.close()
          PY
