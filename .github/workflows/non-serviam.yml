name: NON SERVIAM checks

on:
  pull_request:
    paths: ['pieces/non-serviam/**', '.github/workflows/non-serviam.yml']
  push:
    branches: [main]
    paths: ['pieces/non-serviam/**', '.github/workflows/non-serviam.yml']

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: pieces/non-serviam/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pieces/non-serviam/tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
